name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip s-vocalSplit.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - run: gradle assembleDebug --no-daemon
        working-directory: s-vocalSplit
      - run: cp s-vocalSplit/app/build/outputs/apk/debug/app-debug.apk s-vocalSplit.apk
      - run: gh release create v${{ github.run_number }} s-vocalSplit.apk --title "s-vocalSplit v${{ github.run_number }}" --notes "Debug APK"
        env:
          GH_TOKEN: ${{ github.token }}
